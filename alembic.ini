[alembic]
script_location = app/database/migrations
prepend_sys_path = .
version_path_separator = os

# A URL real de conexão é montada dinamicamente em migrations/env.py
# a partir das variáveis de ambiente (app.config.settings), então este
# campo é deixado vazio de propósito.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
